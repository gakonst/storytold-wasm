[package]
name = "vectorcraft-worker"
description = "Headless VectorCraft wasm-bindgen bindings and Rust HTTP Worker adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vectorcraft-engine.workspace = true
vectorcraft-mcp.workspace = true
vectorcraft-format.workspace = true
vectorcraft-plugins.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Request", "Response", "ResponseInit", "Headers", "Url", "UrlSearchParams"] }
