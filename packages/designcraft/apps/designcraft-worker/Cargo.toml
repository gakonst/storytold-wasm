[package]
name = "designcraft-worker"
description = "Headless DesignCraft wasm-bindgen API and Rust Cloudflare Worker HTTP adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
designcraft-engine.workspace = true
designcraft-format.workspace = true
designcraft-idml.workspace = true
designcraft-render.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Request", "Response", "ResponseInit", "Headers", "Url"] }
