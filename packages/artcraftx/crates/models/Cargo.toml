[package]
name = "models"
edition = "2021"
version = "0.0.1"
authors = [
    "Brandon Thomas <bt@brand.io>",
    "Brandon Thomas <echelon@gmail.com>",
]
publish = false

[package.metadata.cargo-udeps.ignore]
normal = ["workspace-build-acceleration"]

[lib]
name = "models"
path = "src/lib.rs"

[dependencies]
# Workspace hack (faster compile times)
workspace-build-acceleration.workspace = true

# Serialization (the configs are served to the frontend as-is)
serde.workspace = true
serde_derive.workspace = true

# Lazily-built model tables
once_cell.workspace = true

[dev-dependencies]
serde_json.workspace = true
strum = { workspace = true, features = ["derive"] }
